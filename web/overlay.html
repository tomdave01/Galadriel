<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=1920, height=1080, initial-scale=1">
    <title>Overseer broadcast overlay</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: "Segoe UI", Arial, sans-serif;
        --green: #b6f35b;
        --glass: rgba(8, 13, 10, .88);
      }
      * { box-sizing: border-box; }
      html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: transparent !important; }
      body { color: #f4f7f2; }
      #overlay-stage { position: fixed; inset: 0; pointer-events: none; }
      #overlay-stack { position: absolute; left: 5%; bottom: 8%; display: grid; gap: 14px; width: min(840px, 72vw); }
      .broadcast-card {
        position: relative; display: grid; gap: 8px; padding: 22px 28px 22px 32px;
        border: 1px solid rgba(182, 243, 91, .55); border-left: 7px solid var(--green);
        border-radius: 5px; background: var(--glass); box-shadow: 0 12px 40px rgba(0,0,0,.4);
        animation: enter .32s ease-out both; backdrop-filter: blur(8px);
      }
      .broadcast-card.exiting { animation: exit .25s ease-in both; }
      .broadcast-card h1 { margin: 0; font-size: clamp(24px, 2vw, 42px); line-height: 1.12; letter-spacing: .01em; }
      .broadcast-card p { margin: 0; color: #e2e9df; font-size: clamp(18px, 1.35vw, 26px); line-height: 1.35; }
      .broadcast-meta { display: flex; justify-content: space-between; gap: 14px; color: #b6f35b; font: 700 14px/1.2 Consolas, monospace; letter-spacing: .1em; text-transform: uppercase; }
      .broadcast-stat { color: #fff; font: 700 17px Consolas, monospace; }
      #marking-layer { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
      #connection-state { position: absolute; right: 2%; top: 2%; color: rgba(255,255,255,.7); font: 12px Consolas, monospace; }
      @keyframes enter { from { opacity: 0; transform: translateX(-28px) translateY(10px); } to { opacity: 1; transform: translate(0); } }
      @keyframes exit { to { opacity: 0; transform: translateX(-20px); } }
      @media (prefers-reduced-motion: reduce) { .broadcast-card, .broadcast-card.exiting { animation-duration: .01ms; } }
    </style>
  </head>
  <body>
    <main id="overlay-stage" aria-live="polite">
      <svg id="marking-layer" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"></svg>
      <section id="overlay-stack"></section>
      <span id="connection-state">CONNECTING</span>
    </main>
    <script src="/config.js"></script>
    <script src="/overlay.js" defer></script>
  </body>
</html>
